<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 秋招投递进度</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--brand:#1d2939;--blue:#175cd3;--green:#067647;--red:#b42318;--amber:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1500px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#667085}.top h1{margin:5px 0 4px;font-size:30px}.sub,.muted{color:var(--muted)}.right{display:flex;gap:10px;align-items:center}.badge{padding:8px 11px;background:#eef2f6;border-radius:99px;font-weight:700;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(16,24,40,.04)}.card{padding:17px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:28px}.toolbar{padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}.filters,.actions{display:flex;gap:10px;flex-wrap:wrap}.filters label{min-width:150px}.filters .search{min-width:280px}label{display:flex;flex-direction:column;gap:5px}label span{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{border:1px solid #d0d5dd;border-radius:9px;padding:10px 11px;font:inherit;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#667085;box-shadow:0 0 0 3px #eef2f6}.btn{border:1px solid #d0d5dd;border-radius:9px;padding:10px 13px;background:#fff;font-weight:750;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{background:#fff1f0;color:var(--red);border-color:#fecdca}.tablebox{overflow:auto}.meta{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panel table{width:100%;min-width:1250px;border-collapse:collapse}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;background:#fff}th{position:sticky;top:0;background:#f9fafb;color:#475467;font-size:12px}.stage{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#eef2f6}.stage.offer{background:#ecfdf3;color:var(--green)}.stage.interview{background:#eff8ff;color:var(--blue)}.stage.written{background:#fffaeb;color:var(--amber)}.stage.rejected{background:#fef3f2;color:var(--red)}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:45px}.modalbg{position:fixed;inset:0;background:rgba(16,24,40,.52);display:grid;place-items:center;padding:16px;z-index:50}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}.modal.small{width:min(480px,100%)}.modal h2{margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid.two{grid-template-columns:repeat(2,1fr)}.full{grid-column:1/-1}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.msg{padding:10px 12px;border-radius:8px;background:#fef3f2;color:var(--red);margin-top:10px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 14px;border-radius:10px;z-index:80}.link{color:var(--blue);text-decoration:none;font-size:12px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.toolbar,.top{flex-direction:column;align-items:stretch}.grid,.grid.two{grid-template-columns:1fr}.full{grid-column:auto}.filters label,.filters .search{width:100%;min-width:0}}
</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">JOB TRACKER</div><h1>2027 届秋招投递进度</h1><div class="sub">多设备同步 · 搜索筛选 · Excel 导入导出</div></div><div class="right"><span id="sync" class="badge">等待登录</span><button id="logout" class="btn hidden">退出登录</button></div></header><section class="kpis"><div class="card"><span>投递总数</span><strong id="kt">0</strong></div><div class="card"><span>进入笔试</span><strong id="kw">0</strong></div><div class="card"><span>进入面试</span><strong id="ki">0</strong></div><div class="card"><span>Offer</span><strong id="ko">0</strong></div><div class="card"><span>已挂 / 拒绝</span><strong id="kr">0</strong></div></section><section class="panel toolbar"><div class="filters"><label class="search"><span>搜索</span><input id="q" placeholder="公司 / 岗位 / 地点 / 备注"></label><label><span>当前阶段</span><select id="sf"><option value="all">全部</option><option>已投递</option><option>笔试</option><option>一面</option><option>二面</option><option>综面</option><option>Offer</option><option value="已挂">已挂 / 拒绝</option></select></label></div><div class="actions"><button id="add" class="btn primary">＋ 新增投递</button><button id="imp" class="btn">导入 Excel</button><button id="exp" class="btn">导出 Excel</button><input id="file" type="file" accept=".xlsx,.xls" class="hidden"></div></section><section class="panel"><div class="meta"><div><strong id="count">0</strong> 条记录</div><div id="last" class="muted"></div></div><div class="tablebox"><table><thead><tr><th>序号</th><th>投递公司</th><th>岗位</th><th>地点</th><th>投递</th><th>笔试</th><th>一面</th><th>二面</th><th>综面</th><th>Offer</th><th>当前阶段</th><th>备注</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table><div id="empty" class="empty">登录后可导入原 Excel，或直接新增记录。</div></div></section></div>
<div id="editBg" class="modalbg hidden"><div class="modal"><h2 id="editTitle">新增投递</h2><form id="form"><input id="rid" type="hidden"><div class="grid"><label><span>公司 *</span><input id="company" required></label><label><span>岗位 *</span><input id="role" required></label><label><span>地点</span><input id="location"></label><label><span>投递</span><input id="application" placeholder="已投递 / 9.2 投递"></label><label><span>笔试</span><input id="written_test"></label><label><span>一面</span><input id="interview1"></label><label><span>二面</span><input id="interview2"></label><label><span>综面</span><input id="final_interview"></label><label><span>Offer</span><input id="offer"></label><label class="full"><span>JD / 投递链接</span><input id="link" type="url"></label><label class="full"><span>下一事项</span><input id="next_event"></label><label class="full"><span>备注</span><textarea id="notes" rows="4"></textarea></label></div><div class="modalactions"><button type="button" id="cancel" class="btn">取消</button><button class="btn primary">保存</button></div></form></div></div>
<div id="authBg" class="modalbg"><div class="modal small"><div class="eyebrow">PRIVATE CLOUD</div><h2>登录秋招进度表</h2><p class="muted">数据存放在 Supabase，并通过账号和 RLS 隔离。首次使用请注册。</p><form id="authForm"><label><span>邮箱</span><input id="email" type="email" required autocomplete="email"></label><br><label><span>密码（至少 6 位）</span><input id="pw" type="password" minlength="6" required autocomplete="current-password"></label><div id="authMsg" class="msg hidden"></div><div class="modalactions"><button type="button" id="signup" class="btn">首次使用：注册</button><button class="btn primary">登录</button></div></form></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const URL='https://xgmvvsqbcbubuimimzvp.supabase.co',KEY='sb_publishable_TeS5t6UqaeBEoQ2xkb9rFw_cfiEb_eS';const sb=supabase.createClient(URL,KEY);let user=null,rows=[];const $=id=>document.getElementById(id),clean=v=>String(v??'').trim(),esc=v=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const reject=['挂','拒','淘汰','未通过','不通过','感谢信','终止','没过','凉'];function stage(r){if([r.application,r.written_test,r.interview1,r.interview2,r.final_interview,r.offer,r.notes].some(v=>reject.some(w=>clean(v).includes(w))))return'已挂';if(clean(r.offer))return'Offer';if(clean(r.final_interview))return'综面';if(clean(r.interview2))return'二面';if(clean(r.interview1))return'一面';if(clean(r.written_test))return'笔试';if(clean(r.application))return'已投递';return'未开始'}function badge(s){let c=s==='Offer'?'offer':s==='已挂'?'rejected':s==='笔试'?'written':['一面','二面','综面'].includes(s)?'interview':'';return`<span class="stage ${c}">${esc(s)}</span>`}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}function setSync(t){$('sync').textContent=t}async function load(){if(!user)return;setSync('同步中…');let{data,error}=await sb.from('job_applications').select('*').eq('user_id',user.id).order('seq');if(error){toast('同步失败：'+error.message);return}rows=data||[];render();setSync('云端已同步');$('last').textContent='最近同步：'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}function render(){let q=clean($('q').value).toLowerCase(),f=$('sf').value,view=rows.filter(r=>(!q||[r.company,r.role,r.location,r.application,r.written_test,r.interview1,r.interview2,r.final_interview,r.offer,r.notes].join(' ').toLowerCase().includes(q))&&(f==='all'||stage(r)===f));$('count').textContent=view.length;$('empty').classList.toggle('hidden',view.length>0);$('tb').innerHTML=view.map(r=>`<tr><td>${esc(r.seq)}</td><td><strong>${esc(r.company)}</strong>${r.link?`<br><a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">打开链接</a>`:''}</td><td>${esc(r.role)}</td><td>${esc(r.location)}</td><td>${esc(r.application)}</td><td>${esc(r.written_test)}</td><td>${esc(r.interview1)}</td><td>${esc(r.interview2)}</td><td>${esc(r.final_interview)}</td><td>${esc(r.offer)}</td><td>${badge(stage(r))}${r.next_event?`<br><small class="muted">下一步：${esc(r.next_event)}</small>`:''}</td><td>${esc(r.notes)}</td><td><button class="btn" data-edit="${r.id}">编辑</button> <button class="btn danger" data-del="${r.id}">删除</button></td></tr>`).join('');$('kt').textContent=rows.length;$('kw').textContent=rows.filter(r=>clean(r.written_test)).length;$('ki').textContent=rows.filter(r=>clean(r.interview1)||clean(r.interview2)||clean(r.final_interview)).length;$('ko').textContent=rows.filter(r=>stage(r)==='Offer').length;$('kr').textContent=rows.filter(r=>stage(r)==='已挂').length}function openEdit(r={}){$('editTitle').textContent=r.id?'编辑投递':'新增投递';['rid','company','role','location','application','written_test','interview1','interview2','final_interview','offer','link','next_event','notes'].forEach(k=>$(k).value=k==='rid'?(r.id||''):(r[k]||''));if(!r.id)$('application').value='已投递';$('editBg').classList.remove('hidden')}async function save(e){e.preventDefault();let id=$('rid').value,p={user_id:user.id,company:clean($('company').value),role:clean($('role').value),location:clean($('location').value),application:clean($('application').value),written_test:clean($('written_test').value),interview1:clean($('interview1').value),interview2:clean($('interview2').value),final_interview:clean($('final_interview').value),offer:clean($('offer').value),link:clean($('link').value),next_event:clean($('next_event').value),notes:clean($('notes').value),updated_at:new Date().toISOString()};if(id)p.id=id;else p.seq=rows.length+1;let{error}=await sb.from('job_applications').upsert(p);if(error)return toast('保存失败：'+error.message);$('editBg').classList.add('hidden');await load();toast('已保存')}async function del(id){if(!confirm('确定删除这条记录？'))return;let{error}=await sb.from('job_applications').delete().eq('id',id).eq('user_id',user.id);if(error)return toast('删除失败：'+error.message);await load();toast('已删除')}function parseExcel(buf){let book=XLSX.read(buf,{type:'array'}),sh=book.Sheets[book.SheetNames[0]],a=XLSX.utils.sheet_to_json(sh,{header:1,defval:''}),hi=a.findIndex(r=>r.includes('投递公司')&&r.includes('岗位'));if(hi<0)throw Error('未找到“投递公司 / 岗位”表头');let h=a[hi].map(clean),ix=n=>h.indexOf(n);return a.slice(hi+1).filter(r=>clean(r[ix('投递公司')])||clean(r[ix('岗位')])).map((r,i)=>({user_id:user.id,seq:Number(r[ix('序号')])||i+1,company:clean(r[ix('投递公司')]),role:clean(r[ix('岗位')]),location:ix('地点')>=0?clean(r[ix('地点')]):'',application:ix('投递')>=0?clean(r[ix('投递')]):'',written_test:ix('笔试')>=0?clean(r[ix('笔试')]):'',interview1:ix('一面')>=0?clean(r[ix('一面')]):'',interview2:ix('二面')>=0?clean(r[ix('二面')]):'',final_interview:ix('综面')>=0?clean(r[ix('综面')]):'',offer:ix('Offer')>=0?clean(r[ix('Offer')]):'',notes:ix('备注')>=0?clean(r[ix('备注')]):''})).filter(r=>r.company&&r.role)}async function importExcel(file){try{let arr=parseExcel(await file.arrayBuffer());if(!arr.length)throw Error('没有可导入记录');let current=new Map(rows.map(r=>[(clean(r.company)+'::'+clean(r.role)).toLowerCase(),r]));let payload=arr.map(r=>{let m=current.get((r.company+'::'+r.role).toLowerCase());return m?{...m,...r,id:m.id,user_id:user.id}:r});let{error}=await sb.from('job_applications').upsert(payload);if(error)throw error;await load();toast(`已导入 ${arr.length} 条记录`)}catch(e){toast('导入失败：'+e.message)}$('file').value=''}function exportExcel(){let h=['序号','投递公司','岗位','地点','投递','笔试','一面','二面','综面','Offer','下一事项','链接','备注'],a=rows.map((r,i)=>[r.seq||i+1,r.company,r.role,r.location,r.application,r.written_test,r.interview1,r.interview2,r.final_interview,r.offer,r.next_event,r.link,r.notes]),ws=XLSX.utils.aoa_to_sheet([['2027 届秋招投递进度记录'],h,...a]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'投递进度');XLSX.writeFile(wb,'秋招投递进度_'+new Date().toISOString().slice(0,10)+'.xlsx')}async function login(e){e.preventDefault();$('authMsg').classList.add('hidden');let{data,error}=await sb.auth.signInWithPassword({email:clean($('email').value),password:$('pw').value});if(error){$('authMsg').textContent=error.message;$('authMsg').classList.remove('hidden');return}user=data.user;$('authBg').classList.add('hidden');$('logout').classList.remove('hidden');await load()}async function signup(){let{data,error}=await sb.auth.signUp({email:clean($('email').value),password:$('pw').value});$('authMsg').classList.remove('hidden');if(error)return $('authMsg').textContent=error.message;if(data.session){user=data.user;$('authBg').classList.add('hidden');$('logout').classList.remove('hidden');await load()}else $('authMsg').textContent='注册成功。请先到邮箱完成确认，再回来登录。'}$('authForm').addEventListener('submit',login);$('signup').onclick=signup;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('add').onclick=()=>openEdit();$('cancel').onclick=()=>$('editBg').classList.add('hidden');$('form').addEventListener('submit',save);$('q').oninput=render;$('sf').onchange=render;$('imp').onclick=()=>$('file').click();$('file').onchange=e=>e.target.files[0]&&importExcel(e.target.files[0]);$('exp').onclick=exportExcel;document.addEventListener('click',e=>{let x=e.target.closest('[data-edit]');if(x)openEdit(rows.find(r=>r.id===x.dataset.edit));let d=e.target.closest('[data-del]');if(d)del(d.dataset.del)});(async()=>{let{data:{session}}=await sb.auth.getSession();if(session?.user){user=session.user;$('authBg').classList.add('hidden');$('logout').classList.remove('hidden');await load()}else{rows=[];render()}sb.channel('jobs-live').on('postgres_changes',{event:'*',schema:'public',table:'job_applications'},()=>user&&load()).subscribe()})();
</script></body></html>
